# Render Blueprint — two fully separate deployments (stable + test)
#
# Usage:
#   1. Push this file to `main`.
#   2. In Render: New + -> Blueprint -> pick this repo -> Apply.
#   3. Render asks for the `sync: false` secrets. Use the STABLE bot token
#      and STABLE Turso database for the existing `dummydreams-discord-bot` service, and the TEST bot
#      token and TEST database for `dummydreams-test`.
# - `staging` is the shared pre-production deployment branch. Validate a
#   candidate there before promoting it to `main`.
#
# Notes:
# - `plan: free` preserves the existing Render billing tier. Free services
#   sleep after inactivity, interrupting the Discord gateway and TikTok
#   observer. Use a paid always-on plan only after explicit cost approval.
# - Python version comes from `.python-version` (3.11.9).
# - Both services run the read-only preflight before starting the bot. A bad
#   production database configuration therefore stops startup instead of
#   allowing a misleading healthy process.
# - `PORT` is injected by Render automatically; do not set it here.

services:
  # ---------------------------------------------------------------- STABLE
  - type: web
    name: dummydreams-discord-bot
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python scripts/preflight.py && python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_ENV
        value: stable
      - key: DEBUG_MODE
        value: "0"
      - key: DISCORD_TOKEN
        sync: false
      - key: EXPECTED_GUILD_ID
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANNOUNCEMENT_CHANNEL_ID
        sync: false
      - key: VERIFIED_ROLE_ID
        sync: false
      - key: API_SECRET_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: EULER_WEBHOOK_SECRET
        sync: false
      - key: LOG_ERROR_CHANNEL_ID
        value: "1572123726839947305"

  # ------------------------------------------------------------------ TEST
  - type: web
    name: dummydreams-test
    runtime: python
    plan: free
    region: singapore
    branch: staging
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python scripts/preflight.py && python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_ENV
        value: test
      - key: DEBUG_MODE
        value: "1"
      - key: DISCORD_TOKEN
        sync: false
      - key: EXPECTED_GUILD_ID
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANNOUNCEMENT_CHANNEL_ID
        sync: false
      - key: VERIFIED_ROLE_ID
        sync: false
      - key: API_SECRET_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: EULER_WEBHOOK_SECRET
        sync: false
      - key: LOG_ERROR_CHANNEL_ID
        value: "1571473445714133075"
